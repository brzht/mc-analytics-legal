<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization result — mc-analytics</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff; --fg: #16181d; --muted: #5b6270; --line: #e4e7ec; --accent: #1c4ed8; --box: #f6f7f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1013; --fg: #e8eaee; --muted: #9aa3b2; --line: #262b33; --accent: #7aa2ff; --box: #171a20; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 72px 16px 96px; }
  h1 { font-size: 24px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 32px; font-size: 14px; }
  .label { font-size: 13px; color: var(--muted); margin: 24px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .value {
    background: var(--box); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px;
    word-break: break-all; user-select: all;
  }
  button {
    margin-top: 12px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--box); color: var(--fg); font: inherit; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .warn { color: var(--muted); font-size: 14px; margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Authorization result</h1>
  <p class="sub">mc-analytics · this page only displays what the platform sent back. Nothing is stored or transmitted.</p>
  <div id="out"></div>
  <p class="warn">The code below is short-lived and single-use. Hand it to whoever is setting up the connection, then close this page.</p>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var out = document.getElementById('out');
    var rows = [];
    ['code', 'scopes', 'state', 'error', 'error_description'].forEach(function (k) {
      var v = q.get(k);
      if (v) rows.push([k, v]);
    });
    if (rows.length === 0) {
      out.innerHTML = '<p>Nothing to show — open this page through the platform’s authorization flow.</p>';
      return;
    }
    rows.forEach(function (r) {
      var l = document.createElement('div');
      l.className = 'label';
      l.textContent = r[0];
      var v = document.createElement('div');
      v.className = 'value';
      v.textContent = r[1];
      out.appendChild(l);
      out.appendChild(v);
    });
    var code = q.get('code');
    if (code) {
      var b = document.createElement('button');
      b.textContent = 'Copy code';
      b.onclick = function () {
        navigator.clipboard.writeText(code).then(function () { b.textContent = 'Copied'; });
      };
      out.appendChild(b);
    }
  })();
</script>
</body>
</html>
